[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psi-bench"
version = "0.2.0.dev1"
description = "Ψ-Bench: Evaluating Persona-Sensitive Influencing in Persuasive Dialogues"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Peixuan Han", email = "ph16@illinois.edu"}
]
keywords = ["benchmark", "persuasion", "personalization", "LLM", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0.0",
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "nltk>=3.8.0",
    "json-repair>=0.17.0",
]

[project.urls]
Repository = "https://github.com/yourusername/psi_bench"
Documentation = "https://github.com/yourusername/psi_bench#readme"
"Bug Tracker" = "https://github.com/yourusername/psi_bench/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
]

[project.scripts]
psi-bench = "psi_bench.cli:main"

[tool.setuptools]
packages = ["psi_bench"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
